# SPDX-License-Identifier: Apache-2.0
name: Build
on:
  push:
    branches: [ master ]
  pull_request:
  merge_group:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/CPM
  # Matches our other C++ projects, and the clang-cl 22.x on the Windows leg.
  CLANG_VERSION: "22"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Windows-cl",       os: windows-2025, preset: cl-release }
          - { name: "Windows-clang-cl", os: windows-2025, preset: clangcl-release }
          - { name: "Linux-clang",      os: ubuntu-24.04, preset: clang-release }
          - { name: "Linux-gcc",        os: ubuntu-24.04, preset: gcc-release }
          - { name: "Linux-clang-ubsan", os: ubuntu-24.04, preset: clang-ubsan }
          - { name: "macOS-clang",      os: macos-15,     preset: clang-release }
    steps:
      - uses: actions/checkout@v4

      # Split restore/save rather than a combined actions/cache: in a fan-out
      # matrix a combined step makes every leg a writer of the same key at once.
      - name: Restore CPM cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('test/CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-

      - uses: seanmiddleditch/gha-setup-ninja@v6

      # ubuntu-24.04 defaults to GCC 13, whose libstdc++ lacks parts of C++23.
      - name: Install GCC 14
        if: matrix.preset == 'gcc-release'
        run: sudo apt-get update && sudo apt-get install -y g++-14

      # ubuntu-24.04's stock clang is 18, which does not expose std::expected
      # through the libstdc++ it picks up -- measured: every std::expected use
      # failed to compile while the GCC leg, on the same machine image, was fine.
      # Pull Clang ${{ env.CLANG_VERSION }} from the official LLVM apt source, as
      # our other C++ projects already do, which also lines this leg up with
      # the clang-cl 22.x used on the Windows leg. Also covers clang-ubsan,
      # which is Linux-only and needs the same compiler.
      - name: Install Clang ${{ env.CLANG_VERSION }}
        if: (matrix.preset == 'clang-release' || matrix.preset == 'clang-ubsan') && runner.os == 'Linux'
        run: |
          # apt.llvm.org intermittently fails to resolve on a fresh runner --
          # observed once as "Temporary failure in name resolution", which
          # failed this step before a single file was compiled and painted a
          # red X on a commit that was fine. A red leg that means nothing is
          # worse than no leg: it costs someone an investigation and teaches
          # everyone to skim past failures.
          #
          # Retry the install as a whole rather than any single command. wget's
          # own --tries does not cover a DNS failure, and llvm.sh and apt-get
          # can each fail transiently for their own reasons.
          for attempt in 1 2 3; do
            if wget -q https://apt.llvm.org/llvm.sh                && chmod +x llvm.sh                && sudo ./llvm.sh ${{ env.CLANG_VERSION }}                && sudo apt-get install -y clang-${{ env.CLANG_VERSION }}; then
              exit 0
            fi
            echo "::warning::Clang install attempt $attempt failed; retrying"
            sleep $((attempt * 15))
          done
          echo "::error::Clang ${{ env.CLANG_VERSION }} could not be installed after 3 attempts"
          exit 1

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: bash
        run: |
          extra=()
          [[ "${{ matrix.preset }}" == gcc-* ]] && extra+=(-DCMAKE_CXX_COMPILER=g++-14)
          # Linux clang only: see the "Install Clang" step above. macOS clang is
          # AppleClang with libc++ and needs no override.
          if [[ "${{ matrix.preset }}" == clang-* && "${{ runner.os }}" == "Linux" ]]; then
            extra+=(-DCMAKE_CXX_COMPILER=clang++-${{ env.CLANG_VERSION }})
          fi
          cmake --preset ${{ matrix.preset }} "${extra[@]}"

      - name: Save CPM cache
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('test/CMakeLists.txt') }}

      - name: Build
        # FORMULA_TOOLS defaults ON for this top-level checkout, same as
        # FORMULA_BUILD_TESTS and FORMULA_BUILD_EXAMPLES, so this also builds
        # formula-cpp-gallery -- no extra flag needed, and none is passed here
        # deliberately, so a consumer configuring this same tree as a
        # subproject sees the option default the other way.
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        # Includes gallery.is-current: it fails the build if docs/gallery.md
        # has drifted from what tools/gallery/main.cpp currently generates.
        run: ctest --preset ${{ matrix.preset }}
